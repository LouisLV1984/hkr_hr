<dialog class="app-dialog record-editor-dialog" id="mpf-add"><form class="dialog-panel record-editor-form" method="post" action="{{ url_for('references.create_mpf_scheme') }}"><div class="section-head record-editor-head"><h2>{{ t("references.add_mpf_scheme") }}</h2><button class="icon-btn" type="button" data-dialog-close>×</button></div><div class="record-editor-body form-grid"><label><span>{{ t("mpf.scheme_name") }}</span><input name="name" required></label><label><span>{{ t("mpf.employer_account_no") }}</span><input name="employer_account_no" required></label><label><span>{{ t("mpf.payroll_group_no") }}</span><input name="payroll_group_no" placeholder="N/A"></label><label><span>{{ t("mpf.calculation_mode") }}</span><select name="calculation_mode"><option value="regular">{{ t("mpf.mode_regular") }}</option><option value="casual">{{ t("mpf.mode_casual") }}</option></select></label></div><div class="dialog-actions record-editor-actions"><button class="ghost-btn" type="button" data-dialog-close>{{ t("common.cancel") }}</button><button class="primary-btn" type="submit">{{ t("common.save") }}</button></div></form></dialog>
{% for scheme in mpf_schemes %}<dialog class="app-dialog record-editor-dialog" id="mpf-edit-{{ scheme.id }}"><form class="dialog-panel record-editor-form" method="post" action="{{ url_for('references.update_mpf_scheme', scheme_id=scheme.id) }}"><div class="section-head record-editor-head"><h2>{{ t("references.edit_mpf_scheme") }}</h2><button class="icon-btn" type="button" data-dialog-close>×</button></div><div class="record-editor-body form-grid"><label><span>{{ t("mpf.scheme_name") }}</span><input name="name" value="{{ scheme.name }}" required></label><label><span>{{ t("mpf.employer_account_no") }}</span><input name="employer_account_no" value="{{ scheme.employer_account_no }}" required></label><label><span>{{ t("mpf.payroll_group_no") }}</span><input name="payroll_group_no" value="{{ scheme.payroll_group_no or 'N/A' }}"></label><label><span>{{ t("mpf.calculation_mode") }}</span><select name="calculation_mode"><option value="regular" {% if scheme.calculation_mode == 'regular' %}selected{% endif %}>{{ t("mpf.mode_regular") }}</option><option value="casual" {% if scheme.calculation_mode == 'casual' %}selected{% endif %}>{{ t("mpf.mode_casual") }}</option></select></label></div><div class="dialog-actions record-editor-actions"><button class="ghost-btn" type="button" data-dialog-close>{{ t("common.cancel") }}</button><button class="primary-btn" type="submit">{{ t("common.save") }}</button></div></form></dialog>{% endfor %}
