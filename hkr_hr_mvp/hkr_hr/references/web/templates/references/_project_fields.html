<div class="record-editor-body form-grid">
  <label><span>{{ t("references.project_name") }}</span><input name="name" value="{{ item.name if item is defined else '' }}" required></label>
  <label><span>{{ t("employee.work_region") }}</span><select name="region_id"><option value="">{{ t("common.not_set") }}</option>{% for region in regions %}<option value="{{ region.id }}" {% if item is defined and item.region_id == region.id %}selected{% endif %}>{{ region.display_name }}</option>{% endfor %}</select></label>
  <label><span>{{ t("common.location") }}</span><input name="work_location" value="{{ item.work_location if item is defined and item.work_location else '' }}"></label>
  <label><span>{{ t("common.contact_person") }}</span><input name="contact_name" value="{{ item.contact_name if item is defined and item.contact_name else '' }}"></label>
  <label><span>{{ t("references.contact_phone") }}</span><input name="contact_phone" value="{{ item.contact_phone if item is defined and item.contact_phone else '' }}"></label>
  <label><span>{{ t("references.ot_divisor") }}</span><input type="number" min="1" step="0.5" name="daily_ot_divisor" value="{{ item.daily_ot_divisor if item is defined else 9 }}"></label>
</div>
